name: AR Canary

run-name: AR Canary

on:
  workflow_dispatch:
    inputs:
        CLEAN_ARTIFACTS:
            type: boolean
            description: Use no artifacts for next build (will be saved as clean artifacts)
            required: false
            default: false
        windows_build:
            description: 'Build Windows'
            required: false
            default: true
            type: boolean
        linux_build:
            description: 'Build Linux'
            required: false
            default: true
            type: boolean
        mac_build:
            description: 'Build Mac'
            required: false
            default: true
            type: boolean

jobs:

#### Windows Build ####
    Windows-Profile:
        if: ${{ inputs.windows_build }}
        uses: ./.github/workflows/windows-build.yml
        with:
            compiler: msvc
            config: profile
            image: windows-2022
            platform: Windows
            type: profile
            last_artifact: ${{ inputs.CLEAN_ARTIFACTS == false }}
            msvc_platform_toolset: 'v143'
            cmake_version: '~3.24'

    Windows-Asset:
        if: ${{ inputs.windows_build }}
        needs: Windows-Profile
        uses: ./.github/workflows/windows-build.yml
        with:
            compiler: msvc
            config: profile
            image: windows-2022
            platform: Windows
            type: asset_profile
            msvc_platform_toolset: 'v143'
            cmake_version: '~3.24'

    Windows-Test:
        if: ${{ inputs.windows_build }}
        needs: Windows-Asset
        uses: ./.github/workflows/windows-build.yml
        with:
            compiler: msvc
            config: profile
            image: windows-2022
            platform: Windows
            type: test_cpu_profile
            msvc_platform_toolset: 'v143'
            cmake_version: '~3.24'

#### Linux Build ####
    Linux-Profile:
        if: ${{ inputs.linux_build }}
        uses: ./.github/workflows/linux-build.yml
        with:
            compiler: clang
            config: profile
            image: ubuntu-24.04
            platform: Linux
            type: profile
            last_artifact: ${{ inputs.CLEAN_ARTIFACTS == false }}
            clang_version: '18'
            cmake_version: '~3.24'

    Linux-Asset:
        if: ${{ inputs.linux_build }}
        needs: Linux-Profile
        uses: ./.github/workflows/linux-build.yml
        with:
            compiler: clang
            config: profile
            image: ubuntu-24.04
            platform: Linux
            type: asset_profile
            clang_version: '18'
            cmake_version: '~3.24'

    Linux-Test:
        if: ${{ inputs.linux_build }}
        needs: Linux-Asset
        uses: ./.github/workflows/linux-build.yml
        with:
            compiler: clang
            config: profile
            image: ubuntu-24.04
            platform: Linux
            type: test_profile
            desktop: true
            clang_version: '18'
            cmake_version: '~3.24'

#### Mac Build ####
    Mac-Profile:
        if: ${{ inputs.mac_build }}
        uses: ./.github/workflows/mac-build.yml
        with:
            compiler: clang
            config: profile
            image: macos-14
            platform: Mac
            type: profile
            last_artifact: ${{ inputs.CLEAN_ARTIFACTS == false }}
            cmake_version: '~3.24'

    Mac-Asset:
        if: ${{ inputs.mac_build }}
        needs: Mac-Profile
        uses: ./.github/workflows/mac-build.yml
        with:
            compiler: clang
            config: profile
            image: macos-14
            platform: Mac
            type: asset_profile
            cmake_version: '~3.24'

    Mac-Test:
        if: ${{ inputs.mac_build }}
        needs: Mac-Asset
        uses: ./.github/workflows/mac-build.yml
        with:
            compiler: clang
            config: profile
            image: macos-14
            platform: Mac
            type: test_profile
            cmake_version: '~3.24'
