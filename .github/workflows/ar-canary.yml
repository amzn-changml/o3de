name: AR Canary

run-name: AR Canary - Latest Compilers

on:
  workflow_dispatch:
    inputs:
        CLEAN_ARTIFACTS:
            type: boolean
            description: Use no artifacts for next build (will be saved as clean artifacts)
            required: false
            default: false
        windows_build:
            description: 'Build Windows (MSVC v143 latest)'
            required: false
            default: true
            type: boolean
        linux_build:
            description: 'Build Linux (clang-18 on ubuntu-24.04)'
            required: false
            default: true
            type: boolean
        mac_build:
            description: 'Build Mac (macos-14 M1)'
            required: false
            default: true
            type: boolean

jobs:

# AR Canary tests builds with the latest available compilers on each platform.
# This serves as an early warning system to catch compatibility issues before
# they affect the main AR workflow.
#
# Platform configurations:
# - Windows: MSVC v143 (latest toolset, no version pinning)
# - Linux: clang-18 on ubuntu-24.04
# - Mac: Apple Clang via Xcode on macos-14 (M1 arm64)

#### Windows Canary Build - MSVC v143 Latest ####
    Windows-Canary-Profile:
        if: ${{ inputs.windows_build }}
        uses: ./.github/workflows/windows-build.yml
        with:
            compiler: msvc
            config: profile
            image: windows-2022
            platform: Windows
            type: profile
            last_artifact: ${{ inputs.CLEAN_ARTIFACTS == false }}
            msvc_platform_toolset: 'v143'
            cmake_version: '~3.24'

    Windows-Canary-Asset:
        if: ${{ inputs.windows_build }}
        needs: Windows-Canary-Profile
        uses: ./.github/workflows/windows-build.yml
        with:
            compiler: msvc
            config: profile
            image: windows-2022
            platform: Windows
            type: asset_profile
            msvc_platform_toolset: 'v143'
            cmake_version: '~3.24'

    Windows-Canary-Test:
        if: ${{ inputs.windows_build }}
        needs: Windows-Canary-Asset
        uses: ./.github/workflows/windows-build.yml
        with:
            compiler: msvc
            config: profile
            image: windows-2022
            platform: Windows
            type: test_cpu_profile
            msvc_platform_toolset: 'v143'
            cmake_version: '~3.24'

#### Linux Canary Build - clang-18 on ubuntu-24.04 ####
    Linux-Canary-Profile:
        if: ${{ inputs.linux_build }}
        uses: ./.github/workflows/linux-build.yml
        with:
            compiler: clang
            config: profile
            image: ubuntu-24.04
            platform: Linux
            type: profile
            last_artifact: ${{ inputs.CLEAN_ARTIFACTS == false }}
            clang_version: '18'
            cmake_version: '~3.24'

    Linux-Canary-Asset:
        if: ${{ inputs.linux_build }}
        needs: Linux-Canary-Profile
        uses: ./.github/workflows/linux-build.yml
        with:
            compiler: clang
            config: profile
            image: ubuntu-24.04
            platform: Linux
            type: asset_profile
            clang_version: '18'
            cmake_version: '~3.24'

    Linux-Canary-Test:
        if: ${{ inputs.linux_build }}
        needs: Linux-Canary-Asset
        uses: ./.github/workflows/linux-build.yml
        with:
            compiler: clang
            config: profile
            image: ubuntu-24.04
            platform: Linux
            type: test_profile
            desktop: true
            clang_version: '18'
            cmake_version: '~3.24'

#### Mac Canary Build - macos-14 (M1 arm64) ####
    Mac-Canary-Profile:
        if: ${{ inputs.mac_build }}
        uses: ./.github/workflows/mac-build.yml
        with:
            compiler: clang
            config: profile
            image: macos-14
            platform: Mac
            type: profile
            last_artifact: ${{ inputs.CLEAN_ARTIFACTS == false }}
            cmake_version: '~3.24'

    Mac-Canary-Asset:
        if: ${{ inputs.mac_build }}
        needs: Mac-Canary-Profile
        uses: ./.github/workflows/mac-build.yml
        with:
            compiler: clang
            config: profile
            image: macos-14
            platform: Mac
            type: asset_profile
            cmake_version: '~3.24'

    Mac-Canary-Test:
        if: ${{ inputs.mac_build }}
        needs: Mac-Canary-Asset
        uses: ./.github/workflows/mac-build.yml
        with:
            compiler: clang
            config: profile
            image: macos-14
            platform: Mac
            type: test_profile
            cmake_version: '~3.24'
