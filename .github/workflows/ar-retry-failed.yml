name: AR Retry Failed Jobs

on:
  workflow_run:
    workflows: ["AR"]
    types: [completed]

env:
  MAX_RETRY_ATTEMPTS: 3

jobs:
  retry-ar-failed-jobs:
    name: Retry ${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Retry failed jobs
        if: ${{ github.event.workflow_run.run_attempt < env.MAX_RETRY_ATTEMPTS }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run rerun ${{ github.event.workflow_run.id }} --failed -R ${{ github.repository }}

      - name: Notify retry limit reached
        if: ${{ github.event.workflow_run.run_attempt >= env.MAX_RETRY_ATTEMPTS }}
        run: |
          echo "::warning::Maximum retry attempts (${{ env.MAX_RETRY_ATTEMPTS }}) reached for workflow run ${{ github.event.workflow_run.id }}. Manual intervention may be required."

